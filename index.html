<!doctype html>
<html lang='de'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Wetter Widget Test</title>
</head>
<body style='margin:0;padding:20px;font-family:Arial,sans-serif;'>

  <div id='weather-widget-frame' style='width:100%;overflow:hidden;'>
    <iframe width='300' height='100' name='CW1' style='width:300px;height:100px;border:1px solid;border-color:transparent;display:block;transform-origin:top left;' src='https://api.wetteronline.de/wetterwidget?gid=10382&modeid=CW1&seourl=berlin&locationname=Berlin&lang=de'></iframe>
  </div>
  <script>
    (() => {
      const baseWidth = 300;
      const baseHeight = 100;
      const frame = document.getElementById('weather-widget-frame');
      const iframe = frame.querySelector('iframe');

      function resizeWeatherWidget() {
        const scale = frame.clientWidth / baseWidth;
        frame.style.height = `${baseHeight * scale}px`;
        iframe.style.transform = `scale(${scale})`;
      }

      resizeWeatherWidget();
      if ('ResizeObserver' in window) {
        new ResizeObserver(resizeWeatherWidget).observe(frame);
      } else {
        window.addEventListener('resize', resizeWeatherWidget);
      }
    })();
  </script>

</body>
</html>
